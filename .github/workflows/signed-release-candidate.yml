name: Signed Release Candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: SemVer release candidate version
        required: true
        type: string

permissions:
  contents: read

jobs:
  package:
    name: Build Signed Release Candidate
    runs-on: windows-latest
    environment: production-signing

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Validate signing configuration
        shell: pwsh
        env:
          PM365_CODESIGN_PFX_BASE64: ${{ secrets.PM365_CODESIGN_PFX_BASE64 }}
          PM365_CODESIGN_PFX_PASSWORD: ${{ secrets.PM365_CODESIGN_PFX_PASSWORD }}
          PM365_CODESIGN_PUBLISHER: ${{ vars.PM365_CODESIGN_PUBLISHER }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PM365_CODESIGN_PFX_BASE64)) {
            throw 'The production-signing environment is missing PM365_CODESIGN_PFX_BASE64.'
          }
          if ([string]::IsNullOrWhiteSpace($env:PM365_CODESIGN_PFX_PASSWORD)) {
            throw 'The production-signing environment is missing PM365_CODESIGN_PFX_PASSWORD.'
          }
          if ([string]::IsNullOrWhiteSpace($env:PM365_CODESIGN_PUBLISHER)) {
            throw 'The production-signing environment is missing PM365_CODESIGN_PUBLISHER.'
          }

      - name: Materialize signing certificate
        shell: pwsh
        env:
          PM365_CODESIGN_PFX_BASE64: ${{ secrets.PM365_CODESIGN_PFX_BASE64 }}
        run: |
          $certificatePath = Join-Path $env:RUNNER_TEMP 'pagemaker365-codesign.pfx'
          [System.IO.File]::WriteAllBytes(
            $certificatePath,
            [Convert]::FromBase64String($env:PM365_CODESIGN_PFX_BASE64))

      - name: Verify repository
        shell: pwsh
        run: .\scripts\verify.ps1

      - name: Build and sign release candidate
        shell: pwsh
        env:
          PM365_CODESIGN_PFX_PASSWORD: ${{ secrets.PM365_CODESIGN_PFX_PASSWORD }}
          PM365_CODESIGN_PUBLISHER: ${{ vars.PM365_CODESIGN_PUBLISHER }}
          PM365_RELEASE_VERSION: ${{ inputs.version }}
        run: |
          .\scripts\package.ps1 `
            -Configuration Release `
            -Version $env:PM365_RELEASE_VERSION `
            -OutputPath .\artifacts\signed-release-candidate `
            -CodeSigningCertificatePath (Join-Path $env:RUNNER_TEMP 'pagemaker365-codesign.pfx') `
            -ExpectedPublisher $env:PM365_CODESIGN_PUBLISHER `
            -RequireCleanSource

      - name: Verify signed release evidence
        shell: pwsh
        env:
          PM365_RELEASE_VERSION: ${{ inputs.version }}
        run: |
          .\scripts\test-package-hygiene.ps1 `
            -PackagePath .\artifacts\signed-release-candidate
          .\scripts\test-release-package.ps1 `
            -PackagePath .\artifacts\signed-release-candidate `
            -ArchivePath .\artifacts\signed-release-candidate.zip `
            -ExpectedVersion $env:PM365_RELEASE_VERSION `
            -RequireSignature

      - name: Remove temporary certificate file
        if: always()
        shell: pwsh
        run: Remove-Item -LiteralPath (Join-Path $env:RUNNER_TEMP 'pagemaker365-codesign.pfx') -Force -ErrorAction SilentlyContinue

      - name: Upload signed release candidate
        uses: actions/upload-artifact@v4
        with:
          name: pagemaker365-installer-signed-release-candidate
          path: |
            artifacts/signed-release-candidate
            artifacts/signed-release-candidate.zip
            artifacts/signed-release-candidate.zip.sha256
          if-no-files-found: error
          retention-days: 30
