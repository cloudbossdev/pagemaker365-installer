name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify and Package
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Verify repository
        shell: pwsh
        run: .\scripts\verify.ps1

      - name: Package installer
        shell: pwsh
        run: .\scripts\package.ps1 -Configuration Release -Version "0.1.0-ci.${{ github.run_number }}" -OutputPath .\artifacts\ci-package

      - name: Inspect package hygiene
        shell: pwsh
        run: .\scripts\test-package-hygiene.ps1 -PackagePath .\artifacts\ci-package

      - name: Verify release evidence
        shell: pwsh
        run: .\scripts\test-release-package.ps1 -PackagePath .\artifacts\ci-package -ArchivePath .\artifacts\ci-package.zip -ExpectedVersion "0.1.0-ci.${{ github.run_number }}"

      - name: Verify deterministic packaging
        shell: pwsh
        run: |
          .\scripts\package.ps1 -Configuration Release -Version "0.1.0-ci.${{ github.run_number }}" -OutputPath .\artifacts\ci-package-repeat | Out-Null
          $first = (Get-FileHash .\artifacts\ci-package.zip -Algorithm SHA256).Hash
          $second = (Get-FileHash .\artifacts\ci-package-repeat.zip -Algorithm SHA256).Hash
          if ($first -ne $second) {
            throw "Identical package inputs produced different archives: $first / $second"
          }

      - name: Upload installer package
        uses: actions/upload-artifact@v7
        with:
          name: pagemaker365-installer-ci-package
          path: |
            artifacts/ci-package
            artifacts/ci-package.zip
            artifacts/ci-package.zip.sha256
          if-no-files-found: error
          retention-days: 7
